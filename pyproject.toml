[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "run-ledger"
version = "0.2.0"
description = "Append-only agent run ledger with decimal cost accounting, redacted diary and review timeline."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ardhya Novri Ramadhan" }]
keywords = ["agents", "ledger", "cost", "observability", "diary", "sqlite"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
runledger = "runledger.cli:main"

[tool.setuptools.packages.find]
include = ["runledger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
